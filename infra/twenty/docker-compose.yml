# Jarvis CRM — white-labeled, multi-tenant fork of Twenty (https://twenty.com)
#
# Official stack: NestJS `server` + background `worker` + Postgres + Redis.
# Deploy on any Ubuntu VPS. See README.md (and FORK.md / branding/) for full setup.
#
# Phase 2: runs our BRANDED image (ghcr.io/MG-CO/jarvis-crm) with native
# multi-workspace ON — one data-isolated workspace per client, reached by subdomain
# (<client>.crm.jarvismgco.com). Needs wildcard DNS + TLS for *.crm.jarvismgco.com.
#
# Image tag is PINNED — this is real client data, never track :latest.
# Bump deliberately and back up the db first (README has the pg_dump command).
# AGPL-3.0: see AGPL-COMPLIANCE.md — the source link must stay in the running app.

name: jarvis-crm

services:
  server:
    # Branded build of our fork (see FORK.md). Falls back to upstream for a plain
    # Phase-1 deploy: image: twentycrm/twenty:v0.42.0
    image: ${JARVIS_CRM_IMAGE:-ghcr.io/MG-CO/jarvis-crm:v0.42.0}
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      SERVER_URL: ${SERVER_URL}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET}
      STORAGE_TYPE: local
      # Disable signups once the workspaces + API keys exist (see README).
      IS_SIGN_UP_ENABLED: ${IS_SIGN_UP_ENABLED:-true}
      # ── Phase 2: per-client workspaces (subdomain-routed) ──
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-true}
      # TRUE blocks PUBLIC workspace creation on the shared apex API (which must stay public
      # — every workspace frontend calls it). Provisioning still works because a privileged
      # provisioner account (TWENTY_PROVISIONER_EMAIL, a server admin) creates the workspaces.
      # Requires that account to exist + be promoted first (see AUTO-PROVISION.md), else flip
      # to false temporarily. Default true is the secure end state.
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-true}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-${SERVER_URL}}
      DEFAULT_SUBDOMAIN: ${DEFAULT_SUBDOMAIN:-app}
      # ── Rebranded transactional email (invites, resets) on our domain ──
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-crm@jarvismgco.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Jarvis CRM}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-crm@jarvismgco.com}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: curl --fail http://localhost:3000/healthz
      interval: 15s
      timeout: 10s
      retries: 6

  worker:
    image: ${JARVIS_CRM_IMAGE:-ghcr.io/MG-CO/jarvis-crm:v0.42.0}
    restart: always
    command: ["yarn", "worker:prod"]
    volumes:
      - server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      SERVER_URL: ${SERVER_URL}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER}:${PG_DATABASE_PASSWORD}@db:5432/default
      REDIS_URL: redis://redis:6379
      APP_SECRET: ${APP_SECRET}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"   # only `server` runs migrations
      IS_MULTIWORKSPACE_ENABLED: ${IS_MULTIWORKSPACE_ENABLED:-true}
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: ${IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS:-true}
      # Worker sends the transactional emails — needs the same mail config.
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-crm@jarvismgco.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Jarvis CRM}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-crm@jarvismgco.com}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-smtp}
      EMAIL_SMTP_HOST: ${EMAIL_SMTP_HOST:-}
      EMAIL_SMTP_PORT: ${EMAIL_SMTP_PORT:-587}
      EMAIL_SMTP_USER: ${EMAIL_SMTP_USER:-}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  db:
    image: postgres:16
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD}
      POSTGRES_DB: default
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${PG_DATABASE_USER}", "-d", "default"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: always
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data

volumes:
  db-data:
  server-local-data:
  redis-data:
